name: Build and release

# Runs on version tags. To release, set the version, commit, and tag:
#   scripts/set-version.sh 4.0.0 && git commit -am "Release 4.0.0"
#   git tag v4.0.0 && git push origin v4.0.0
#
# The release carries the .deb and the engine tarballs. The container image
# isn't pushed to a registry: each host builds it with
# scripts/build-image.sh, or with the setup wizard from the installed
# package. macOS and Windows packages are deferred.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

# Each downloaded tool is checked against the SHA-256 checksum published
# with its release. When you change a version, copy the new checksum from
# the project's release page. Actions are pinned by commit, with the tag
# the commit had in a comment.
env:
  NFPM_VERSION: "2.48.0"
  # checksums.txt of https://github.com/goreleaser/nfpm/releases/tag/v2.48.0
  NFPM_SHA256: "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750"

jobs:
  deb:
    name: Build the .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Enable pnpm through corepack
        run: corepack enable

      - name: Check that the tag matches the package version
        run: |
          scripts/set-version.sh --check
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package version $version. Run scripts/set-version.sh before tagging."
            exit 1
          fi

      - name: Install nfpm
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz -C "$RUNNER_TEMP/bin" nfpm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the .deb
        run: scripts/build-deb.sh --out dist

      - name: Collect the engine tarballs
        run: cp image/dist/*.tgz dist/

      - name: Write the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/*.deb
            dist/*.tgz
            dist/release-notes.md
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: [deb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: dist/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.deb
            dist/*.tgz
