name: Build and release

# Runs on version tags. To release, set the version, commit, and tag:
#   scripts/set-version.sh 4.0.0 && git commit -am "Release 4.0.0"
#   git tag v4.0.0 && git push origin v4.0.0
#
# The release carries the .deb and the engine tarballs. The container image
# isn't pushed to a registry: each host builds it with
# scripts/build-image.sh, or with the setup wizard from the installed
# package. macOS and Windows packages are deferred.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

env:
  NFPM_VERSION: "2.48.0"

jobs:
  deb:
    name: Build the .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm through corepack
        run: corepack enable

      - name: Check that the tag matches the package version
        run: |
          scripts/set-version.sh --check
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package version $version. Run scripts/set-version.sh before tagging."
            exit 1
          fi

      - name: Install nfpm
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" |
            tar -xz -C "$RUNNER_TEMP/bin" nfpm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the .deb
        run: scripts/build-deb.sh --out dist

      - name: Collect the engine tarballs
        run: cp image/dist/*.tgz dist/

      - name: Write the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.deb
            dist/*.tgz
            dist/release-notes.md
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: [deb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.deb
            dist/*.tgz
