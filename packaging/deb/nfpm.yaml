# nfpm configuration for the ai-orchestrator .deb.
#
# scripts/build-deb.sh assembles a staging directory and runs nfpm from it,
# so every `src` here is relative to that directory: `root/` mirrors the
# installed file system, and `maint/` holds the maintainer scripts. Don't
# run nfpm on this file by hand; run scripts/build-deb.sh.
#
# The server runs as the logged-in user through a systemd user unit, never
# as root. The package installs files only; postinst prints how to enable
# the service.
name: ai-orchestrator
arch: amd64
platform: linux
version: ${AIO_VERSION}
version_schema: semver
section: devel
priority: optional
maintainer: Morris Labs <development@morrislabs.app>
description: |-
  Sandboxed coding agents in Docker, with a multi-vendor review pipeline.
  AI Orchestrator runs Claude Code, Codex, and GitHub Copilot sessions in one
  container per project. The package holds the aio-server user
  service, the aio CLI, the AI Orchestrator and AI Orchestrator Review desktop
  apps, and the Dockerfile the setup wizard builds the container image from.
vendor: AI Orchestrator
homepage: https://github.com/morris-labs/ai-orchestrator
license: Proprietary

depends:
  # The server and CLI ship node_modules built against Node.js 22. The
  # server's better-sqlite3 module is a native addon for Node.js 22's ABI,
  # so a different major version can't load it.
  - nodejs (>= 22)
  - nodejs (<< 23)
  - docker.io | docker-ce
  # The image's Dockerfile uses COPY --chmod, which needs BuildKit.
  - docker-buildx | docker-buildx-plugin
  - tmux
  - git
  - openssh-client
recommends:
  - apparmor
  - xdg-utils

contents:
  # The server and the CLI: production node_modules from `pnpm deploy`.
  - src: root/usr/lib/ai-orchestrator/server
    dst: /usr/lib/ai-orchestrator/server
    type: tree
  - src: root/usr/lib/ai-orchestrator/cli
    dst: /usr/lib/ai-orchestrator/cli
    type: tree

  # The two Electron apps, from `electron-builder --dir`.
  - src: root/usr/lib/ai-orchestrator/boxes
    dst: /usr/lib/ai-orchestrator/boxes
    type: tree
  - src: root/usr/lib/ai-orchestrator/review
    dst: /usr/lib/ai-orchestrator/review
    type: tree

  # Launchers.
  - src: root/usr/bin/aio
    dst: /usr/bin/aio
    file_info:
      mode: 0755
  - src: root/usr/bin/aio-server
    dst: /usr/bin/aio-server
    file_info:
      mode: 0755
  - src: /usr/lib/ai-orchestrator/boxes/aio-boxes
    dst: /usr/bin/aio-boxes
    type: symlink
  - src: /usr/lib/ai-orchestrator/review/aio-review
    dst: /usr/bin/aio-review
    type: symlink

  # Desktop entries and icons.
  - src: root/usr/share/applications/aio-boxes.desktop
    dst: /usr/share/applications/aio-boxes.desktop
    file_info:
      mode: 0644
  - src: root/usr/share/applications/aio-review.desktop
    dst: /usr/share/applications/aio-review.desktop
    file_info:
      mode: 0644
  - src: root/usr/share/icons/hicolor/scalable/apps/aio-boxes.svg
    dst: /usr/share/icons/hicolor/scalable/apps/aio-boxes.svg
    file_info:
      mode: 0644
  - src: root/usr/share/icons/hicolor/scalable/apps/aio-review.svg
    dst: /usr/share/icons/hicolor/scalable/apps/aio-review.svg
    file_info:
      mode: 0644

  # The systemd user unit (packaging/systemd/aio-server.service).
  - src: root/usr/lib/systemd/user/aio-server.service
    dst: /usr/lib/systemd/user/aio-server.service
    file_info:
      mode: 0644

  # The apps' web bundles, which the server serves at /boxes/ and /review/.
  - src: root/usr/share/ai-orchestrator/web
    dst: /usr/share/ai-orchestrator/web
    type: tree

  # The image build context and its build script, for the setup wizard.
  - src: root/usr/share/ai-orchestrator/image
    dst: /usr/share/ai-orchestrator/image
    type: tree
  - src: root/usr/share/ai-orchestrator/scripts
    dst: /usr/share/ai-orchestrator/scripts
    type: tree

  # AppArmor profiles that let the Electron sandbox create user namespaces.
  - src: root/etc/apparmor.d/aio-boxes
    dst: /etc/apparmor.d/aio-boxes
    type: config
    file_info:
      mode: 0644
  - src: root/etc/apparmor.d/aio-review
    dst: /etc/apparmor.d/aio-review
    type: config
    file_info:
      mode: 0644

  # The ufw application profile for the hub's link port
  # (packaging/ufw/aio-hub). The package never enables a rule.
  - src: root/etc/ufw/applications.d/aio-hub
    dst: /etc/ufw/applications.d/aio-hub
    type: config
    file_info:
      mode: 0644

  # The ufw application profile for the hub's GUI port
  # (packaging/ufw/aio-hub-gui). The package never enables a rule.
  - src: root/etc/ufw/applications.d/aio-hub-gui
    dst: /etc/ufw/applications.d/aio-hub-gui
    type: config
    file_info:
      mode: 0644

scripts:
  postinstall: maint/postinst
  preremove: maint/prerm
  postremove: maint/postrm
